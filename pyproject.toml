[project]
name = "cv-maker"
version = "0.1.0"
description = "Write CVs in YAML, edit them in a live-preview web editor, and check how they survive ATS parsing"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jinja2",
    "weasyprint",
    "fastapi",
    "uvicorn",
    "pillow",
    # Reads back the rendered PDF the way an ATS parser does.
    "pdfminer.six",
    "leverparser[pdf]>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "playwright",
]

[project.scripts]
cv-maker = "cv_maker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_maker"]

[tool.pytest.ini_options]
# Browser tests are deselected by default (see tests/conftest.py); the fast
# suite is what runs on a bare `pytest`.
markers = [
    "browser: drives the editor in a real browser (opt-in, slow)",
]
