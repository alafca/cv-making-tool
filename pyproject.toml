[project]
name = "cv-maker"
version = "0.1.0"
description = "Write CVs in YAML, edit them in a live-preview web editor, and check how they survive ATS parsing"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jinja2",
    "weasyprint",
    "fastapi",
    "uvicorn",
    "pillow",
    # Reads back the rendered PDF the way an ATS parser does.
    "pdfminer.six",
    "leverparser[pdf]>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# BLE flags catch-all excepts; the few deliberate ones, at boundaries that
# must report a failure rather than crash, carry a noqa with their reason.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests hold long literals (YAML, JS snippets) and catch broadly on purpose.
"tests/*" = ["E501", "BLE001"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "playwright",
]

[project.scripts]
cv-maker = "cv_maker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_maker"]

[tool.pytest.ini_options]
# Browser tests are deselected by default (see tests/conftest.py); the fast
# suite is what runs on a bare `pytest`.
markers = [
    "browser: drives the editor in a real browser (opt-in, slow)",
]
