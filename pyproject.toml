[project]
name = "cv-maker"
version = "0.1.0"
description = "CLI tool to generate professional PDF CVs from YAML data"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jinja2",
    "weasyprint",
    "fastapi",
    "uvicorn",
]

[project.scripts]
cv-maker = "cv_maker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_maker"]
