<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Maker - Editor</title>
<script src="/static/js-yaml.min.js"></script>
<style>
/* Colour roles. Components reference these, never a raw value, so a pair can be
   re-measured in one place. Every text pair here meets 4.5:1 and every control
   border 3:1 against the surface it sits on; the browser test re-checks the
   rendered pairs. */
:root {
    --bar-bg: #1a1a2e;
    --bar-raised: #2a2a4a;
    --bar-raised-hover: #3a3a5a;
    --bar-border: #7a7a99;
    --bar-text: #fff;
    --bar-text-muted: #c8c8d8;
    --accent: #2e7d32;
    --accent-hover: #256b29;
    --accent-soft: #e8f5e9;
    --accent-soft-hover: #c8e6c9;
    --accent-border: #81c784;
    --danger: #d32f2f;
    --danger-hover: #b71c1c;
    --danger-on-dark: #ff8a80;
    --surface: #fff;
    --surface-muted: #fafafa;
    --surface-sunken: #f5f5f5;
    --surface-preview: #e0e0e0;
    --border: #e0e0e0;
    --control-border: #8a8a8a;
    --text: #111;
    --text-secondary: #555;
    --text-muted: #666;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--surface-sunken); color: var(--text); }
/* Groups are spaced 2x wider apart (24px) than the controls within them (8px),
   so the bar reads as four clusters rather than one row of eighteen things. */
.toolbar {
    display: flex; align-items: center; gap: 8px 24px; padding: 8px 16px;
    background: var(--bar-bg); color: var(--bar-text); flex-wrap: wrap; position: relative;
    z-index: 400;
}
.toolbar .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar .brand { font-weight: 700; font-size: 16px; }
.toolbar label { font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.toolbar select, .toolbar input[type="color"] { cursor: pointer; }
.toolbar select { padding: 4px 6px; border-radius: 4px; border: 1px solid var(--bar-border); background: var(--bar-raised); color: var(--bar-text); font-size: 13px; }
.toolbar input[type="color"] { width: 28px; height: 28px; border: 1px solid var(--bar-border); border-radius: 4px; background: none; padding: 1px; }
.toolbar input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; }
.toolbar .spacer { flex: 1; }
/* One filled action per view: Save. Everything else is a raised neutral. */
.toolbar button {
    padding: 5px 14px; border: 1px solid var(--bar-border); border-radius: 4px; font-size: 13px;
    cursor: pointer; font-weight: 600; background: var(--bar-raised); color: var(--bar-text);
    transition-property: background-color, color; transition-duration: .15s;
}
.toolbar button:hover { background: var(--bar-raised-hover); }
/* Scoped under .toolbar so they outrank the base button rule above. */
.toolbar .btn-primary { background: var(--accent); border-color: var(--accent); }
.toolbar .btn-primary:hover { background: var(--accent-hover); }
.toolbar .btn-danger { color: var(--danger-on-dark); }
.toolbar .btn-danger:hover { background: #4a2a2a; }

/* ATS report: an overlay panel, so opening it never reflows the toolbar or
   the editor panes. It starts below the toolbar (top is set from the bar's
   measured height when it opens) so the buttons stay reachable while it is up;
   the toolbar also outranks it, in case the bar wraps while the panel is
   open. */
.ats-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 92vw;
    background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,0.25); z-index: 300;
    display: none; flex-direction: column;
}
.ats-panel.open { display: flex; }
.ats-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--bar-bg); color: var(--bar-text); flex-shrink: 0;
}
.ats-head h2 { font-size: 15px; font-weight: 700; flex: 1; }
.ats-close {
    background: none; border: none; color: var(--bar-text-muted); font-size: 22px;
    cursor: pointer; line-height: 1; width: 32px; height: 32px; border-radius: 4px;
}
.ats-close:hover { color: var(--bar-text); background: var(--bar-raised-hover); }
.ats-score { font-size: 20px; font-weight: 700; }
/* One chip per opinion, ours first. A tool with no score still gets a chip so
   the reader can see it ran, and why it has nothing to say. */
.ats-scores {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px;
    background: #f1f1f6; border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
}
.ats-chip {
    display: flex; flex-direction: column; min-width: 120px; padding: 6px 10px;
    border-radius: 6px; background: #fff; border: 1px solid #d8d8e0;
}
.ats-chip .chip-label { font-size: 12px; color: var(--text-secondary); }
.ats-chip .chip-score { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ats-chip .chip-score.na { font-size: 12px; font-weight: 400; color: var(--text-muted); }
.ats-external { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
.ats-external h3 { font-size: 13px; margin: 0 0 6px; }
.ats-external .note { font-size: 12px; color: #555; margin-bottom: 6px; line-height: 1.45; }
.ats-external table { font-size: 12px; border-collapse: collapse; margin-bottom: 6px; }
.ats-external td { padding: 1px 10px 1px 0; color: #333; vertical-align: top; }
.ats-external ul { margin: 0 0 0 18px; padding: 0; font-size: 12px; line-height: 1.45; }
.ats-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.ats-jd { padding: 10px 16px; border-bottom: 1px solid #e0e0e0; background: #fafafa; }
.ats-jd label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
.ats-jd textarea {
    width: 100%; min-height: 54px; resize: vertical; padding: 6px 8px;
    border: 1px solid var(--control-border); border-radius: 4px; font: inherit; font-size: 13px;
}
.ats-finding {
    border-left: 4px solid #bbb; padding: 8px 10px; margin-bottom: 10px;
    background: #fafafa; border-radius: 0 4px 4px 0;
}
.ats-finding .msg { font-size: 13px; font-weight: 600; color: #111; }
.ats-finding .det { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.45; }
.ats-finding .tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 2px;
}
.sev-critical { border-left-color: #c62828; background: #fdecea; }
.sev-high     { border-left-color: #ef6c00; background: #fff4e5; }
.sev-medium   { border-left-color: #f9a825; background: #fffae6; }
.sev-low      { border-left-color: #90a4ae; }
.sev-good     { border-left-color: #2e7d32; background: #edf7ed; }
.page-count {
    font-size: 12px; font-weight: 600;
    min-width: 58px; text-align: right; font-variant-numeric: tabular-nums;
}

/* Transient messages float below the toolbar instead of sitting inside it:
   anything in the flex row shifts the buttons, or wraps the bar taller, as
   soon as it has text. Anchored to the toolbar so it follows if that wraps. */
.toast {
    position: absolute; top: calc(100% + 8px); right: 16px; z-index: 200;
    max-width: 340px; padding: 8px 14px; border-radius: 6px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    opacity: 0; pointer-events: none;
    transition-property: opacity; transition-duration: .18s;
    display: flex; align-items: center; gap: 10px;
}
.toast.show { opacity: 1; }
/* Errors stay until dismissed, so they can be read and acted on. */
.toast.error { background: var(--danger); pointer-events: auto; }
.toast-close {
    background: none; border: 1px solid rgba(255,255,255,0.6); color: #fff; border-radius: 4px;
    width: 24px; height: 24px; font-size: 16px; line-height: 1; cursor: pointer; flex-shrink: 0;
}
.toast-close:hover { background: rgba(255,255,255,0.15); }
@media (prefers-reduced-motion: no-preference) {
    .toast { transform: translateY(-6px); transition-property: opacity, transform; }
    .toast.show { transform: translateY(0); }
    .toolbar button:active, .add-btn:active { transform: scale(0.96); }
}

/* Toggle buttons */
.view-toggle { display: flex; gap: 0; margin-left: 8px; }
.toolbar .view-toggle button {
    padding: 4px 12px; border-radius: 0; font-size: 13px; color: var(--bar-text-muted);
}
.toolbar .view-toggle button:first-child { border-radius: 4px 0 0 4px; }
.toolbar .view-toggle button:last-child { border-radius: 0 4px 4px 0; border-inline-start: none; }
.toolbar .view-toggle button.active { background: var(--accent); color: var(--bar-text); border-color: var(--accent); }

.main {
    flex: 1; display: flex; min-height: 0;
}
.editor-pane {
    flex: 1; display: flex; flex-direction: column; border-inline-end: 1px solid var(--border);
}
.editor-pane textarea {
    flex: 1; resize: none; padding: 12px; font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px; line-height: 1.5; border: none; background: #1e1e2e;
    color: #cdd6f4; tab-size: 2;
}
/* The browser's own focus ring, drawn inside so the pane edge does not clip it. */
.editor-pane textarea:focus-visible { outline: 2px solid var(--accent-border); outline-offset: -2px; }
.preview-pane {
    flex: 1; overflow-y: auto; overflow-x: hidden; background: var(--surface-preview);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 20px; position: relative;
}
.preview-pane iframe {
    width: 210mm; border: none; background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    transform-origin: top center; flex-shrink: 0;
}
.splitter {
    width: 6px; cursor: col-resize; background: var(--control-border);
    transition-property: background-color; transition-duration: .15s;
    flex-shrink: 0;
}
.splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--accent); }

/* Fields view */
#fieldsView {
    flex: 1; overflow-y: auto; padding: 16px; background: var(--surface-muted);
    display: none;
}
#fieldsView .section {
    margin-bottom: 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
}
#fieldsView .section-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text);
    margin-bottom: 10px; letter-spacing: 0.06em;
}
#fieldsView label.field-label {
    display: block; font-size: 12px; color: var(--text); margin-bottom: 3px; margin-top: 8px;
}
#fieldsView label.field-label:first-of-type { margin-top: 0; }
#fieldsView input[type="text"],
#fieldsView textarea,
#fieldsView select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--control-border); border-radius: 4px;
    font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text);
    transition-property: border-color; transition-duration: .15s;
}
#fieldsView input[type="text"]:focus,
#fieldsView textarea:focus,
#fieldsView select:focus { border-color: var(--accent); }
#fieldsView textarea { resize: vertical; min-height: 60px; }

/* Repeatable groups. The card radius is the section radius minus its padding,
   clamped, so the nested corners stay concentric. */
.repeatable-item {
    background: var(--surface-muted); border: 1px solid var(--border); border-radius: 4px;
    padding: 12px 14px; margin-top: 8px; position: relative;
}
.repeatable-item .item-actions {
    position: absolute; top: 8px; inset-inline-end: 8px; display: flex; gap: 4px;
}
.repeatable-item .move-btn, .repeatable-item .remove-btn {
    background: var(--surface-preview); color: var(--text-secondary); border: none; border-radius: 50%;
    width: 28px; height: 28px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; padding: 0; transition-property: background-color; transition-duration: .15s;
}
.repeatable-item .move-btn:hover { background: #bdbdbd; }
.repeatable-item .remove-btn { background: var(--danger); color: #fff; }
.repeatable-item .remove-btn:hover { background: var(--danger-hover); }
.add-btn {
    margin-top: 8px; padding: 6px 14px; background: var(--accent-soft); color: var(--accent);
    border: 1px dashed var(--accent-border); border-radius: 4px; cursor: pointer;
    font-size: 12px; font-weight: 600;
}
.add-btn:hover { background: var(--accent-soft-hover); }
.link-hint {
    font-size: 12px; color: var(--text-muted); padding: 6px 16px 0; background: var(--surface-muted);
}
.link-hint code { background: #eee; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
/* The pulse that shows which field a preview click landed on. Under reduced
   motion the focus ring and selection carry the cue on their own. */
@media (prefers-reduced-motion: no-preference) {
    @keyframes fieldFlash {
        0% { box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.6); }
        100% { box-shadow: 0 0 0 3px rgba(46, 125, 50, 0); }
    }
    .field-flash { animation: fieldFlash 1.2s ease-out; }
}
</style>
</head>
<body>
<header class="toolbar">
    <h1 class="brand">CV Maker</h1>
    <div class="group" role="group" aria-label="CV file">
        <label>CV <select id="cv" title="Which CV you are editing"></select></label>
        <button class="btn-cv" id="newCvBtn" title="Create a new CV">+ New</button>
        <button class="btn-cv" id="dupCvBtn" title="Duplicate the current CV">Duplicate</button>
        <button class="btn-cv btn-danger" id="delCvBtn" title="Delete the current CV">Delete</button>
    </div>
    <div class="group" role="group" aria-label="Appearance">
        <label>Color <input type="color" id="color" value="#111111"></label>
        <label>Style <select id="style" title="Typeface and spacing; saved with the CV as meta.style"></select></label>
        <label><input type="checkbox" id="photo"> Photo</label>
    </div>
    <div class="view-toggle" role="group" aria-label="Editor view">
        <button id="btnFields" class="active" aria-pressed="true" onclick="toggleView('fields')">Fields</button>
        <button id="btnYaml" aria-pressed="false" onclick="toggleView('yaml')">YAML</button>
    </div>
    <span class="spacer"></span>
    <span class="page-count" id="pageCount" title="Pages in the generated PDF"></span>
    <div class="group" role="group" aria-label="Actions">
        <button class="btn-primary" id="saveBtn">Save</button>
        <button id="pdfBtn">Download PDF</button>
        <button id="htmlBtn">Export HTML</button>
        <button id="mdBtn" title="Copy the whole CV as Markdown, for pasting into a chat">Copy Markdown</button>
        <button id="atsBtn" title="Check how well this CV survives ATS parsing">ATS check</button>
    </div>
    <div class="toast" id="status" role="status" aria-live="polite"></div>
</header>
<div class="ats-panel" id="atsPanel" role="dialog" aria-labelledby="atsTitle">
    <div class="ats-head">
        <h2 id="atsTitle" tabindex="-1">ATS check</h2>
        <span class="ats-score" id="atsScore" title="Built-in checks"></span>
        <button class="ats-close" id="atsClose" aria-label="Close the ATS check">&times;</button>
    </div>
    <div class="ats-scores" id="atsScores"></div>
    <div class="ats-jd">
        <label for="atsJd">Job description (optional) &mdash; compares keywords against it</label>
        <textarea id="atsJd" placeholder="Paste a job ad here, then re-run the check."></textarea>
    </div>
    <div class="ats-body" id="atsBody"></div>
</div>
<main class="main">
    <div class="editor-pane">
        <textarea id="yaml" spellcheck="false" aria-label="CV as YAML" placeholder="Loading YAML..."></textarea>
        <div class="link-hint" id="linkHint">In descriptions and bullets: <code>[text](url)</code> for a link, <code>**text**</code> for bold (sparingly, on results)</div>
        <div id="fieldsView"></div>
    </div>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
         aria-label="Resize the editor and preview panes" tabindex="0"></div>
    <div class="preview-pane" id="previewPane">
        <iframe id="preview" title="CV preview"></iframe>
    </div>
</main>
<script>
const yamlEl = document.getElementById('yaml');
const previewEl = document.getElementById('preview');
const cvEl = document.getElementById('cv');
const colorEl = document.getElementById('color');
const styleEl = document.getElementById('style');
const photoEl = document.getElementById('photo');
const statusEl = document.getElementById('status');
const fieldsView = document.getElementById('fieldsView');
const btnYaml = document.getElementById('btnYaml');
const btnFields = document.getElementById('btnFields');

// The textarea is the visible pane on first paint, so start in 'yaml' and
// switch to fields after the initial load. Keeping this in sync with the DOM
// matters: getPayload() overwrites the textarea from the fields when
// currentView is 'fields'.
let currentView = 'yaml';
let dirty = false;

// Styles the server offers, from /api/config. The choice lives in the CV's
// meta.style, so both the toolbar select and the Meta field show the same
// value and either one writes it into the YAML.
let styles = [{ id: 'classic', label: 'Classic', detail: '' }];
const DEFAULT_STYLE = 'classic';

function knownStyle(id) {
    return styles.some(s => s.id === id) ? id : DEFAULT_STYLE;
}

function styleOptions(selected) {
    const current = knownStyle(selected);
    return styles.map(s =>
        `<option value="${escAttr(s.id)}" title="${escAttr(s.detail || '')}"` +
        `${s.id === current ? ' selected' : ''}>${esc(s.label)}</option>`
    ).join('');
}

// Keep the toolbar select in step with whatever YAML is about to render.
function syncStyleSelect(yamlText) {
    try {
        const data = jsyaml.load(yamlText) || {};
        styleEl.value = knownStyle((data.meta || {}).style);
    } catch (e) { /* invalid YAML: leave the select alone */ }
}
let loadedCv = null;
let defaultCv = null;

function markDirty() { dirty = true; }

let flashTimer;
function flash(msg, err) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!err);
    statusEl.classList.add('show');
    clearTimeout(flashTimer);
    if (err) {
        // An error stays until dismissed: it names what to fix, and a message
        // that fades in 2.6 seconds cannot be read, let alone acted on.
        const close = document.createElement('button');
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Dismiss message');
        close.textContent = '\u00d7';
        close.addEventListener('click', () => statusEl.classList.remove('show'));
        statusEl.appendChild(close);
        return;
    }
    // Keep the text while it fades so the box does not blank mid-transition.
    flashTimer = setTimeout(() => statusEl.classList.remove('show'), 2600);
}

function getPayload() {
    if (currentView === 'fields') {
        yamlEl.value = fieldsToYaml();
    }
    return {
        yaml: yamlEl.value,
        cv: cvEl.value || null,
        show_photo: photoEl.checked,
        primary_color: colorEl.value,
    };
}

function downloadName(ext) {
    return (cvEl.value || 'cv') + '.' + ext;
}

let debounceTimer;
function schedulePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(refreshPreview, 500);
}

let previewSeq = 0;
previewEl.onload = () => { fitPreview(); attachPreviewClicks(); };

async function refreshPreview() {
    const seq = ++previewSeq;
    try {
        const payload = getPayload();
        syncStyleSelect(payload.yaml);
        const res = await fetch('/api/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const html = await res.text();
        if (seq !== previewSeq) return; // a newer request is in flight
        previewEl.srcdoc = html;
        updatePageCount(res.headers.get('X-Page-Count'));
    } catch (e) {
        flash('Unable to render the preview: ' + e.message, true);
    }
}

const pageCountEl = document.getElementById('pageCount');
function updatePageCount(value) {
    const n = parseInt(value, 10);
    if (!n) { pageCountEl.textContent = ''; return; }
    pageCountEl.textContent = n === 1 ? '1 page' : n + ' pages';
    pageCountEl.style.color = n === 1 ? '#81c784' : '#ffb74d';
}

// --- Toggle View ---
function toggleView(mode) {
    if (mode === currentView) return;

    if (mode === 'fields') {
        try {
            const data = jsyaml.load(yamlEl.value) || {};
            yamlToFields(data);
        } catch (e) {
            flash('Invalid YAML: ' + e.message, true);
            return;
        }
        yamlEl.style.display = 'none';
        fieldsView.style.display = 'block';
        document.getElementById('linkHint').style.display = '';
        btnFields.classList.add('active');
        btnYaml.classList.remove('active');
        btnFields.setAttribute('aria-pressed', 'true');
        btnYaml.setAttribute('aria-pressed', 'false');
    } else {
        yamlEl.value = fieldsToYaml();
        yamlEl.style.display = '';
        fieldsView.style.display = 'none';
        document.getElementById('linkHint').style.display = 'none';
        btnYaml.classList.add('active');
        btnFields.classList.remove('active');
        btnYaml.setAttribute('aria-pressed', 'true');
        btnFields.setAttribute('aria-pressed', 'false');
    }
    currentView = mode;
}

// --- Fields → YAML ---
// The last full document parsed into the fields view. fieldsToYaml() only
// knows about the sections it renders, so anything else in the file (a section
// added by hand, or one this page is too old to know about) is carried over
// from here instead of being silently dropped on the next save.
let sourceDoc = {};

function fieldsToYaml() {
    const obj = Object.assign({}, sourceDoc);
    obj.name = gv('f-name');
    obj.headline = gv('f-headline');

    obj.contact = {
        email: gv('f-email'),
        phone: gv('f-phone'),
        location: gv('f-location'),
        linkedin: { text: gv('f-linkedin-text'), url: gv('f-linkedin-url') },
        github: { text: gv('f-github-text'), url: gv('f-github-url') },
    };

    obj.meta = {
        photo: gv('f-photo'),
        lang: gv('f-lang'),
        // Classic is the default, so it is left out rather than written.
        style: gv('f-style') === DEFAULT_STYLE ? '' : gv('f-style'),
    };

    obj.summary = gv('f-summary');

    // Experience
    obj.experience = [];
    fieldsView.querySelectorAll('.exp-item').forEach(el => {
        const bullets = el.querySelector('.exp-bullets').value
            .split('\n').map(s => s.trim()).filter(Boolean);
        obj.experience.push({
            title: el.querySelector('.exp-title').value,
            company: el.querySelector('.exp-company').value,
            location: el.querySelector('.exp-location').value,
            dates: el.querySelector('.exp-dates').value,
            description: el.querySelector('.exp-desc').value,
            bullets,
        });
    });

    // Education
    obj.education = [];
    fieldsView.querySelectorAll('.edu-item').forEach(el => {
        obj.education.push({
            institution: el.querySelector('.edu-inst').value,
            degree: el.querySelector('.edu-degree').value,
            dates: el.querySelector('.edu-dates').value,
        });
    });

    // Publications
    obj.publications = [];
    fieldsView.querySelectorAll('.pub-item').forEach(el => {
        obj.publications.push({
            title: el.querySelector('.pub-title').value,
            venue: el.querySelector('.pub-venue').value,
            year: el.querySelector('.pub-year').value,
            url: el.querySelector('.pub-url').value,
            note: el.querySelector('.pub-note').value,
        });
    });

    // Skills
    obj.skills = [];
    fieldsView.querySelectorAll('.skill-item').forEach(el => {
        obj.skills.push({
            category: el.querySelector('.skill-cat').value,
            entries: el.querySelector('.skill-entries').value,
        });
    });

    // Languages
    obj.languages = [];
    fieldsView.querySelectorAll('.lang-item').forEach(el => {
        obj.languages.push({
            name: el.querySelector('.lang-name').value,
            level: el.querySelector('.lang-level').value,
        });
    });

    // Certifications
    const certs = [];
    fieldsView.querySelectorAll('.cert-input').forEach(el => {
        if (el.value.trim()) certs.push(el.value.trim());
    });
    obj.certifications = certs;

    return jsyaml.dump(prune(obj) || {}, { lineWidth: -1, quotingType: '"', forceQuotes: false });
}

// Drop empty strings, arrays and objects recursively so blanks (e.g. an unused
// LinkedIn text/url pair) don't end up in the YAML and render in the CV.
function prune(v) {
    if (Array.isArray(v)) {
        const arr = v.map(prune).filter(x => x !== undefined);
        return arr.length ? arr : undefined;
    }
    if (v && typeof v === 'object') {
        const out = {};
        for (const [k, val] of Object.entries(v)) {
            const p = prune(val);
            if (p !== undefined) out[k] = p;
        }
        return Object.keys(out).length ? out : undefined;
    }
    if (typeof v === 'string' && v.trim() === '') return undefined;
    return v;
}

function gv(id) { return document.getElementById(id)?.value || ''; }

// --- YAML → Fields ---
function yamlToFields(data) {
    sourceDoc = data || {};
    const c = data.contact || {};
    const m = data.meta || {};

    let html = '';

    // Basic
    html += section('Basic', `
        ${field('Name', 'text', 'f-name', data.name || '')}
        ${field('Headline', 'text', 'f-headline', data.headline || '')}
    `);

    // Contact
    const li = (typeof c.linkedin === 'object' && c.linkedin) ? c.linkedin : { text: c.linkedin || '', url: c.linkedin ? 'https://linkedin.com/in/' + c.linkedin : '' };
    const gh = (typeof c.github === 'object' && c.github) ? c.github : { text: c.github || '', url: c.github ? 'https://github.com/' + c.github : '' };
    html += section('Contact', `
        ${field('Email', 'text', 'f-email', c.email || '')}
        ${field('Phone', 'text', 'f-phone', c.phone || '')}
        ${field('Location', 'text', 'f-location', c.location || '')}
        ${field('LinkedIn text', 'text', 'f-linkedin-text', li.text || '')}
        ${field('LinkedIn URL', 'text', 'f-linkedin-url', li.url || '')}
        ${field('GitHub text', 'text', 'f-github-text', gh.text || '')}
        ${field('GitHub URL', 'text', 'f-github-url', gh.url || '')}
    `);

    // Meta
    html += section('Meta', `
        ${field('Photo path', 'text', 'f-photo', m.photo || '')}
        <label class="field-label" for="f-lang">Language</label>
        <select id="f-lang" class="field-input">
            <option value="es" ${m.lang === 'es' ? 'selected' : ''}>ES</option>
            <option value="en" ${m.lang === 'en' ? 'selected' : ''}>EN</option>
        </select>
        <label class="field-label" for="f-style">Style</label>
        <select id="f-style" class="field-input">${styleOptions(m.style)}</select>
    `);

    // Summary
    html += section('Summary', `
        ${area('Summary', '', data.summary || '', 4, 'f-summary')}
    `);

    // Experience
    const expItems = (data.experience || []).map(expCard).join('');
    html += section('Experience', `
        <div id="exp-list">${expItems}</div>
        <button type="button" class="add-btn" onclick="addExp()">+ Add experience</button>
    `);

    // Education
    const eduItems = (data.education || []).map(eduCard).join('');
    html += section('Education', `
        <div id="edu-list">${eduItems}</div>
        <button type="button" class="add-btn" onclick="addEdu()">+ Add education</button>
    `);

    // Publications
    const pubItems = (data.publications || []).map(pubCard).join('');
    html += section('Publications', `
        <div id="pub-list">${pubItems}</div>
        <button type="button" class="add-btn" onclick="addPub()">+ Add publication</button>
    `);

    // Skills
    const skillItems = (data.skills || []).map(skillCard).join('');
    html += section('Skills', `
        <div id="skill-list">${skillItems}</div>
        <button type="button" class="add-btn" onclick="addSkill()">+ Add skill</button>
    `);

    // Languages
    const langItems = (data.languages || []).map(langCard).join('');
    html += section('Languages', `
        <div id="lang-list">${langItems}</div>
        <button type="button" class="add-btn" onclick="addLang()">+ Add language</button>
    `);

    // Certifications
    const certItems = (data.certifications || []).map(certInput).join('');
    html += section('Certifications', `
        <div id="cert-list">${certItems}</div>
        <button type="button" class="add-btn" onclick="addCert()">+ Add certification</button>
    `);

    fieldsView.innerHTML = html;
    fieldsView.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', onFieldInput);
    });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function section(title, inner) {

// Every control gets an id so its label can point at it; the repeatable cards
// have no natural id, so they draw one from a counter.
let fieldSeq = 0;
function fieldId(id) { return id || ('f-auto-' + (++fieldSeq)); }

function field(label, type, id, value, cls) {
    const fid = fieldId(id);
    return `<label class="field-label" for="${fid}">${label}</label>` +
        `<input type="${type}" id="${fid}"${cls ? ` class="${cls}"` : ''} value="${escAttr(value)}">`;
}

function area(label, cls, value, rows, id) {
    const fid = fieldId(id);
    return `<label class="field-label" for="${fid}">${label}</label>` +
        `<textarea id="${fid}"${cls ? ` class="${cls}"` : ''} rows="${rows}">${esc(value)}</textarea>`;
}

function itemActions(noun) {
    return `<div class="item-actions">
        <button type="button" class="move-btn" onclick="moveItem(this,-1)" aria-label="Move ${noun} up">&#9650;</button>
        <button type="button" class="move-btn" onclick="moveItem(this,1)" aria-label="Move ${noun} down">&#9660;</button>
        <button type="button" class="remove-btn" onclick="this.closest('.repeatable-item').remove(); onFieldInput();" aria-label="Remove ${noun}">&times;</button>
    </div>`;
}

function moveItem(btn, dir) {
    const item = btn.closest('.repeatable-item');
    const sibling = dir === -1 ? item.previousElementSibling : item.nextElementSibling;
    if (!sibling || !sibling.classList.contains('repeatable-item')) return;
    if (dir === -1) item.parentElement.insertBefore(item, sibling);
    else item.parentElement.insertBefore(sibling, item);
    onFieldInput();
}

function addRepeatable(listId, cardFn) {
    const list = document.getElementById(listId);

async function loadCvs(select) {

    if (!res.ok) throw new Error(await errorDetail(res));
    const d = await res.json();

    cvEl.innerHTML = d.cvs

        .join('');

async function createCv(copyFrom) {
    const label = copyFrom ? `Duplicate "${copyFrom}" as:` : 'Name for the new CV:';
    const suggested = copyFrom ? copyFrom + '-copy' : '';
    const name = (prompt(label + '\n(letters, digits, hyphens, underscores)', suggested) || '').trim();
    if (!name) return;
    if (!confirmDiscard('create a new CV?', cvEl, loadedCv)) return;
    try {
        const res = await fetch('/api/cvs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, copy_from: copyFrom || null }),
        });
        if (!res.ok) throw new Error(await errorDetail(res));
        const d = await res.json();
        await loadCvs(d.name);
        await loadYaml(cvEl.value);
        flash(copyFrom ? `Duplicated as "${d.name}"` : `Created "${d.name}"`);
    } catch (e) {
        flash('Unable to create the CV: ' + e.message, true);
    }
}

async function downloadFrom(endpoint, filename) {
    const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(getPayload()),
    });
    if (!res.ok) throw new Error(await errorDetail(res));
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
}

// --- Copy the CV as Markdown (for pasting into a chat with an AI) ---
async function copyText(text) {
    // navigator.clipboard needs a secure context; 127.0.0.1 counts, but fall
    // back to a hidden textarea so the button still works if it does not.
    if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
        if (!document.execCommand('copy')) throw new Error('clipboard unavailable');
    } finally {
        document.body.removeChild(ta);
    }
}

document.getElementById('mdBtn').addEventListener('click', async () => {

        });
        if (!res.ok) throw new Error(await errorDetail(res));
        const md = await res.text();
        await copyText(md);

        flash('Unable to copy: ' + e.message, true);
    }
});

// --- ATS check ---
const atsPanel = document.getElementById('atsPanel');
const atsBody = document.getElementById('atsBody');
const atsScoreEl = document.getElementById('atsScore');

function scoreColour(score) {
    if (score >= 85) return '#81c784';
    if (score >= 60) return '#ffd54f';
    return '#ff8a80';
}

const atsScoresEl = document.getElementById('atsScores');

function scoreChip(label, score, title) {
    const shown = score === null || score === undefined
        ? '<span class="chip-score na">no score</span>'
        : `<span class="chip-score" style="color:${scoreColour(score)}">${score}/100</span>`;
    return `<div class="ats-chip" title="${escAttr(title || '')}">` +
        `<span class="chip-label">${esc(label)}</span>${shown}</div>`;
}

function breakdownTable(breakdown) {
    const rows = Object.entries(breakdown || {}).map(([k, v]) => {
        const val = (v && typeof v === 'object' && !Array.isArray(v))
            ? Object.entries(v).map(([a, b]) => `${a} ${b}`).join(', ')
            : Array.isArray(v) ? v.join(', ') : String(v);
        return `<tr><td>${esc(k.replace(/_/g, ' '))}</td><td>${esc(val)}</td></tr>`;
    });
    return rows.length ? `<table>${rows.join('')}</table>` : '';
}

function renderAtsReport(report) {
    atsScoreEl.textContent = report.score + '/100';
    atsScoreEl.style.color = scoreColour(report.score);

    const external = report.external || [];
    atsScoresEl.innerHTML = scoreChip('Built-in', report.score, "This app's own checks") +
        external.map(e => scoreChip(e.label, e.score, e.note)).join('');

    const findings = report.findings.length ? report.findings.map(f => `
        <div class="ats-finding sev-${escAttr(f.severity)}">
            <span class="tag">${esc(f.severity)} &middot; ${esc(f.check)}</span>
            <div class="msg">${esc(f.message)}</div>
            ${f.detail ? `<div class="det">${esc(f.detail)}</div>` : ''}
        </div>`).join('') : '<p>No findings.</p>';

    const others = external.map(e => `
        <div class="ats-external" data-tool="${escAttr(e.id)}">
            <h4>${esc(e.label)}: ${e.score === null ? 'no score' : e.score + '/100'}</h4>
            ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
            ${breakdownTable(e.breakdown)}
            ${e.findings && e.findings.length ? `<ul>${e.findings.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        </div>`).join('');

    atsBody.innerHTML = findings + others;
}

function positionAtsPanel() {
    const bar = document.querySelector('.toolbar').getBoundingClientRect();
    atsPanel.style.top = bar.bottom + 'px';
}
window.addEventListener('resize', () => {
    if (atsPanel.classList.contains('open')) positionAtsPanel();
});

function closeAtsPanel() {
    atsPanel.classList.remove('open');
    document.getElementById('atsBtn').focus();
}

async function runAtsCheck() {
    positionAtsPanel();
    const wasOpen = atsPanel.classList.contains('open');
    atsPanel.classList.add('open');
    // Focus lands on the panel's heading, so a keyboard user arrives inside it.
    if (!wasOpen) document.getElementById('atsTitle').focus();
    atsBody.innerHTML = '<p>Rendering the PDF and reading it back, then asking the other parsers...</p>';
    atsScoreEl.textContent = '';
    atsScoresEl.innerHTML = '';
    try {
        const payload = getPayload();
        const res = await fetch('/api/ats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                yaml: payload.yaml,
                show_photo: payload.show_photo,
                job_description: document.getElementById('atsJd').value,
            }),
        });
        if (!res.ok) throw new Error(await errorDetail(res));
        renderAtsReport(await res.json());
    } catch (e) {
        atsBody.innerHTML = '';
        flash('ATS check failed: ' + e.message, true);
    }
}

(function() {
    const splitter = document.getElementById('splitter');
    const editorPane = document.querySelector('.editor-pane');
    const previewPane = document.getElementById('previewPane');
    const main = document.querySelector('.main');

    function setSplit(pct) {
        pct = Math.min(Math.max(pct, 10), 90);
        editorPane.style.flex = 'none';
        previewPane.style.flex = 'none';
        editorPane.style.width = pct + '%';
        previewPane.style.width = (100 - pct) + '%';
        splitter.setAttribute('aria-valuenow', String(Math.round(pct)));
        fitPreview();
    }

    function currentSplit() {
        return editorPane.getBoundingClientRect().width / main.getBoundingClientRect().width * 100;
    }

    // Keyboard path: arrow keys move the divider by 5% of the window.
    splitter.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') setSplit(currentSplit() - 5);
        else if (e.key === 'ArrowRight') setSplit(currentSplit() + 5);
        else if (e.key === 'Home') setSplit(10);
        else if (e.key === 'End') setSplit(90);
        else return;
        e.preventDefault();
    });

    splitter.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        splitter.setPointerCapture(e.pointerId);
        splitter.classList.add('dragging');

        const onMove = (e) => {
            const rect = main.getBoundingClientRect();
            setSplit((e.clientX - rect.left) / rect.width * 100);
        };

        const onUp = (e) => {
            splitter.classList.remove('dragging');
            splitter.removeEventListener('pointermove', onMove);
            splitter.removeEventListener('pointerup', onUp);
        };

        splitter.addEventListener('pointermove', onMove);
        splitter.addEventListener('pointerup', onUp);
    });
})();

// --- Scale-to-fit A4 preview ---
function fitPreview() {
    const pane = document.getElementById('previewPane');
    const iframe = document.getElementById('preview');
    const pad = 40; // 20px padding each side
    const availW = pane.clientWidth - pad;
    const ifrW = iframe.offsetWidth;
    if (!ifrW) return;

    // Auto-size iframe height to its content
    try {
        const doc = iframe.contentDocument;
        if (doc && doc.body) {
            iframe.style.height = doc.documentElement.scrollHeight + 'px';
        }
    } catch (e) {}

    const scale = Math.min(availW / ifrW, 1);
    iframe.style.transform = 'scale(' + scale + ')';
    // Adjust the visible height so the pane scrollbar reflects scaled size
    const actualH = iframe.offsetHeight;
    iframe.style.marginBottom = (actualH * (scale - 1)) + 'px';
}
window.addEventListener('resize', fitPreview);

// --- Click-to-edit: clicking preview elements jumps to editor field ---
const REPEATABLE_MAP = {
    experience: { selector: '.exp-item', fields: { title: '.exp-title', company: '.exp-company', location: '.exp-location', dates: '.exp-dates', description: '.exp-desc', bullets: '.exp-bullets' } },
    education: { selector: '.edu-item', fields: { institution: '.edu-inst', degree: '.edu-degree', dates: '.edu-dates' } },
    publications: { selector: '.pub-item', fields: { title: '.pub-title', venue: '.pub-venue', year: '.pub-year', url: '.pub-url', note: '.pub-note' } },
    skills: { selector: '.skill-item', fields: { category: '.skill-cat', entries: '.skill-entries' } },
    languages: { selector: '.lang-item', fields: { name: '.lang-name', level: '.lang-level' } },
};
const SIMPLE_MAP = {
    name: 'f-name', headline: 'f-headline',
    email: 'f-email', phone: 'f-phone', location: 'f-location',
    linkedin: 'f-linkedin-text', github: 'f-github-text',
    summary: 'f-summary',
};

function resolveFieldByPath(path) {
    if (SIMPLE_MAP[path]) return document.getElementById(SIMPLE_MAP[path]);

    if (path.startsWith('certifications.')) {
        const idx = parseInt(path.split('.')[1], 10);
        return fieldsView.querySelectorAll('.cert-input')[idx] || null;
    }

    const parts = path.split('.');
    if (parts.length >= 3) {
        const [kind, idxStr, field] = parts;
        const cfg = REPEATABLE_MAP[kind];
        if (!cfg) return null;
        const item = fieldsView.querySelectorAll(cfg.selector)[parseInt(idxStr, 10)];
        if (!item) return null;
        return item.querySelector(cfg.fields[field]) || item.querySelector('input, textarea');
    }
    return null;
}

function focusEditorField(path) {
    if (currentView !== 'fields') toggleView('fields');
    const target = resolveFieldByPath(path);
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    target.focus();
    if (target.select) target.select();
    target.classList.remove('field-flash');
    void target.offsetWidth; // restart animation
    target.classList.add('field-flash');
}

function attachPreviewClicks() {
    const doc = previewEl.contentDocument;
    if (!doc) return;
    doc.addEventListener('keydown', saveShortcut); // Ctrl+S works with preview focused too

    doc.querySelectorAll('[data-edit]').forEach(el => {
        el.addEventListener('click', (e) => {
            // Allow real link clicks (anchor tags) to still navigate
            if (e.target.closest('a')) return;
            e.preventDefault();
            focusEditorField(el.getAttribute('data-edit'));
        });
    });
}
